[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# The project root, `config/` included, stays read-only. The only thing a deploy writes is the address book
# it produces under `deployments/`, which is also where a re-run reads the mock addresses back from.
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./deployments" },
]

# TickMath is a deployed library, not an inlined one (D-058): its `getSqrtRatioAtTick` is `public`, so every consumer
# carries a link placeholder until an address is supplied. `forge test` deploys and links it automatically, so this list
# stays empty in the repo. A real deployment fills it in (or passes the same string to `forge create --libraries`):
#   libraries = ["src/libraries/TickMath.sol:TickMath:0xTHE_DEPLOYED_ADDRESS"]
# SettlementOracle's constructor rejects an unlinked or mis-linked library, so a wrong value fails the deploy.
libraries = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 64
fail_on_revert = true

[lint]
# style-only notes we deliberately do not follow (SPEC naming: capUSD, valueUSD, uiMultiplier; immutables in camelCase)
exclude_lints = ["mixed-case-variable", "mixed-case-function", "screaming-snake-case-immutable", "unwrapped-modifier-logic"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

# Robinhood Chain (Arbitrum Orbit L2). Gas is paid in ETH.
# mainnet chainId 4663, testnet chainId 46630. URLs come from .env.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

# See https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
