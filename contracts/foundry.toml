[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 64
fail_on_revert = true

[lint]
# style-only notes we deliberately do not follow (SPEC naming: capUSD, valueUSD, uiMultiplier; immutables in camelCase)
exclude_lints = ["mixed-case-variable", "mixed-case-function", "screaming-snake-case-immutable", "unwrapped-modifier-logic"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

# Robinhood Chain (Arbitrum Orbit L2). Gas is paid in ETH.
# mainnet chainId 4663, testnet chainId 46630. URLs come from .env.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

# See https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
